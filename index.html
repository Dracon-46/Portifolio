<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arthur Gaspare Camzano · Desenvolvedor full stack · Falkyria</title>
    <meta
      name="description"
      content="Portfólio de Arthur Gaspare Camzano, desenvolvedor full stack e criador da Falkyria: Nicx, Ascend, AetherTable e Lumen."
    />
    <meta property="og:title" content="Arthur Gaspare Camzano · Falkyria" />

      property="og:description"
      content="Desenvolvedor full stack. IA local, um RPG da vida real, uma mesa virtual de Magic e um portal de dados públicos."

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the saved theme before first paint so there is no flash.
      (function () {
        var r = document.documentElement;
        r.classList.add('js');
        try {
          if (localStorage.getItem('agc-theme') === 'light') r.classList.add('light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Arthur Gaspare Camzano: desenvolvedor full stack e criador da Falkyria.
        Ative o JavaScript para ver o portfólio completo, ou acesse
        <a href="https://github.com/Dracon-46">github.com/Dracon-46</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
